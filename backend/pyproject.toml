[project]
name = "zillahrm-backend"
version = "0.1.0"
description = "Zilla Clinicals HRM backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",
    "argon2-cffi>=23.1",
    "pyjwt>=2.10",
    "python-multipart>=0.0.12",
    "httpx>=0.27",
    "resend>=2.4",
    "slowapi>=0.1.9",
    "pyotp>=2.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "aiosqlite>=0.20",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI uses `Depends()` in argument defaults by design.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Seed data / column definitions read better on one line than wrapped.
"alembic/versions/0002_seed_kpis.py" = ["E501"]
"alembic/versions/0005_kpi_framework_alignment.py" = ["E501"]
"alembic/versions/0010_goals.py" = ["E501"]
"alembic/versions/0011_surveys.py" = ["E501"]
"app/seed_data.py" = ["E501"]
# Tests use inline JSON payloads that read better unwrapped.
"tests/*" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
