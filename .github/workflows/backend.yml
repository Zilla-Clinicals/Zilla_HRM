name: backend

on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hrm
          POSTGRES_PASSWORD: hrm
          POSTGRES_DB: hrm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hrm"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # conftest.py creates/migrates hrm_test from the maintenance 'hrm' db
      TEST_DATABASE_URL: postgresql+asyncpg://hrm:hrm@localhost:5432/hrm_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen
      - name: Lint
        run: uv run ruff check .
      - name: Test
        run: uv run pytest -q
